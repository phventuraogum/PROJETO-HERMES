<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px}.solid{background:#FF6B35;color:#fff}.soft{background:#FFF3ED;color:#B8431F}.outline{background:#fff;color:#1A1A1A;border:1px solid #E6E4E0}.dark{background:#1A1A1A;color:#fff}.success{background:#E6F4E7;color:#2E7D32}.error{background:#FBEAEA;color:#C62828}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.eyebrow{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#FF6B35;padding:4px 0}</style></head>
<body>
<span class="eyebrow">PINN · REVENUE OS</span>
<div style="flex-basis:100%;height:4px"></div>
<span class="tag solid">Bundle</span>
<span class="tag soft">Pinn BAI</span>
<span class="tag outline">Pinn Agent Sales</span>
<span class="tag dark">Pinn Outbound</span>

<span class="tag error"><span class="dot"></span>Não somos SaaS</span>
</body></html>
