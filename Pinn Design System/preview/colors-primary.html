<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans)}.row{display:flex;gap:12px;align-items:stretch}.sw{flex:1;border-radius:var(--r-3);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:128px;border:1px solid var(--rule)}.sw .name{font-size:13px;font-weight:600;color:var(--fg)}.sw .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);letter-spacing:0}.dark{color:#fff;border:none}.dark .name{color:#fff}.dark .hex{color:rgba(255,255,255,.7)}</style></head>
<body><div class="row">
<div class="sw" style="background:#FF6B35;color:#fff;border:none"><div class="name" style="color:#fff">Pinn Orange</div><div class="hex" style="color:rgba(255,255,255,.85)">#FF6B35 · primary · alma da marca</div></div>
<div class="sw" style="background:#E55A2B;color:#fff;border:none"><div class="name" style="color:#fff">Orange Dark</div><div class="hex" style="color:rgba(255,255,255,.85)">#E55A2B · hover · gradient</div></div>
<div class="sw" style="background:#FFF3ED"><div class="name">Orange Light</div><div class="hex">#FFF3ED · wash · callout bg</div></div>
<div class="sw" style="background:#FFF8F4"><div class="name">Orange 50</div><div class="hex">#FFF8F4 · whisper</div></div>
</div></body></html>
