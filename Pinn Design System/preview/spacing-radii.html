<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans)}.row{display:flex;gap:16px;align-items:center}.tok{display:flex;flex-direction:column;align-items:center;gap:8px}.b{width:80px;height:80px;background:var(--bg-soft);border:1px solid var(--rule)}.r1{border-radius:2px}.r2{border-radius:4px}.r3{border-radius:8px}.r4{border-radius:12px}.r5{border-radius:20px}.rp{border-radius:999px}.label{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}.name{font-size:12px;font-weight:600}</style></head>
<body><div class="row">
<div class="tok"><div class="b r1"></div><div class="name">r-1</div><div class="label">2px · chip</div></div>
<div class="tok"><div class="b r2"></div><div class="name">r-2</div><div class="label">4px · control</div></div>
<div class="tok"><div class="b r3"></div><div class="name">r-3</div><div class="label">8px · card</div></div>
<div class="tok"><div class="b r4"></div><div class="name">r-4</div><div class="label">12px · large</div></div>
<div class="tok"><div class="b r5"></div><div class="name">r-5</div><div class="label">20px · hero</div></div>
<div class="tok"><div class="b rp"></div><div class="name">r-pill</div><div class="label">999 · tag only</div></div>
</div></body></html>
