<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans)}.row{display:flex;gap:12px}.sw{flex:1;border-radius:var(--r-3);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:128px;border:1px solid var(--rule)}.name{font-size:13px;font-weight:600}.hex{font-family:var(--font-mono);font-size:11px;letter-spacing:0;opacity:.85}</style></head>
<body><div class="row">
<div class="sw" style="background:#1A1A1A;color:#fff;border:none"><div class="name">Pinn Ink</div><div class="hex">#1A1A1A · text · headings</div></div>
<div class="sw" style="background:#555;color:#fff;border:none"><div class="name">Graphite</div><div class="hex">#555555 · text-2 · captions</div></div>
<div class="sw" style="background:#999;color:#fff;border:none"><div class="name">Mute</div><div class="hex">#999999 · text-3 · meta</div></div>

<div class="sw" style="background:#F6F4EF;color:#1A1A1A"><div class="name">Surface</div><div class="hex">#F6F4EF · warm-off-white</div></div>
<div class="sw" style="background:#fff;color:#1A1A1A"><div class="name">White</div><div class="hex">#FFFFFF · paper</div></div>
</div></body></html>
