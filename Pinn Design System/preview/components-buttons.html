<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:32px;background:var(--bg);font-family:var(--font-sans);display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{font-family:var(--font-sans);font-weight:600;font-size:14px;border-radius:4px;padding:12px 20px;border:1px solid transparent;cursor:pointer;transition:all 200ms cubic-bezier(.2,.7,.2,1)}.primary{background:#FF6B35;color:#fff;box-shadow:0 8px 24px rgba(255,107,53,0.22)}.primary:hover{background:#E55A2B}.secondary{background:#fff;color:#1A1A1A;border-color:#1A1A1A}.secondary:hover{background:#1A1A1A;color:#fff}.ghost{background:transparent;color:#1A1A1A;border-color:transparent}.ghost:hover{color:#FF6B35}.link{background:transparent;color:#FF6B35;border:none;padding:12px 8px;text-decoration:underline;text-underline-offset:3px}.sm{padding:8px 14px;font-size:13px}.lg{padding:16px 28px;font-size:15px}</style></head>
<body>
<button class="btn primary lg">Agendar Diagnóstico de 90 min</button>
<button class="btn secondary">Ver casos</button>
<button class="btn ghost">Ler manifesto</button>
<button class="btn link">Revenue OS →</button>
<div style="flex-basis:100%;height:8px"></div>
<button class="btn primary sm">Confirmar</button>
<button class="btn primary">Padrão</button>
<button class="btn primary lg">Hero CTA</button>
</body></html>
