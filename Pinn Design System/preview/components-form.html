<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);display:flex;flex-direction:column;gap:14px;max-width:480px}label{font-size:12px;font-weight:600;letter-spacing:0.04em;color:#1A1A1A;text-transform:uppercase}input,select{font-family:var(--font-sans);font-size:14px;padding:12px 14px;border:1px solid #E6E4E0;border-radius:4px;background:#fff;color:#1A1A1A;outline:none;transition:border-color 200ms}input:focus,select:focus{border-color:#FF6B35}.field{display:flex;flex-direction:column;gap:6px}.help{font-size:11px;color:#999;font-family:var(--font-mono)}.row{display:flex;gap:12px}.row .field{flex:1}</style></head>
<body>
<div class="row">
<div class="field"><label>Empresa</label><input value="Indústria Química SP" /></div>
<div class="field"><label>Receita anual</label><select><option>R$ 50M – R$ 80M</option><option>R$ 80M – R$ 200M</option></select></div>
</div>
<div class="field"><label>Email corporativo</label><input value="cro@empresa.com.br" /><span class="help">SLA de retorno: 1 dia útil.</span></div>
</body></html>
