<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:32px;background:var(--bg);font-family:var(--font-sans);color:#1A1A1A;display:flex;gap:24px;flex-wrap:wrap;align-items:center}.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;background:#FAF8F4;border-radius:8px;width:180px}.mark{width:64px;height:64px;color:#1A1A1A}.tile.orange{background:#FF6B35}.tile.orange .mark{color:#fff}.tile.dark{background:#0E0E0E}.tile.dark .mark{color:#fff}.tile.dark .label{color:#999}.label{font-family:'JetBrains Mono',monospace;font-size:10px;color:#999;letter-spacing:0.04em}</style></head>
<body>
<div class="tile"><svg class="mark" viewBox="0 0 200 200" fill="currentColor"><path d="M70 50 L130 50 L130 80 L100 80 L100 120 L70 120 Z"/><path d="M130 80 L130 150 L70 150 L70 120 L100 120 L100 80 Z"/></svg><div class="label">MARK · INK ON LIGHT</div></div>
<div class="tile dark"><svg class="mark" viewBox="0 0 200 200" fill="currentColor"><path d="M70 50 L130 50 L130 80 L100 80 L100 120 L70 120 Z"/><path d="M130 80 L130 150 L70 150 L70 120 L100 120 L100 80 Z"/></svg><div class="label">MARK · WHITE ON DARK</div></div>
<div class="tile orange"><svg class="mark" viewBox="0 0 200 200" fill="currentColor"><path d="M70 50 L130 50 L130 80 L100 80 L100 120 L70 120 Z"/><path d="M130 80 L130 150 L70 150 L70 120 L100 120 L100 80 Z"/></svg><div class="label" style="color:#fff">MARK · WHITE ON ORANGE</div></div>
</body></html>
